name: Test formulae

on:
  push:
    paths: ["Formula/**", ".github/workflows/test.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Homebrew (Linux)
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install, test and audit
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/melihcolpan"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/melihcolpan/homebrew-tap"
          brew install --build-from-source melihcolpan/tap/reqstorm
          brew test melihcolpan/tap/reqstorm
          brew audit --strict melihcolpan/tap/reqstorm
